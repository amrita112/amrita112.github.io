# Social links shown at the bottom of the home page.
# Each entry uses the "custom" format (logo + title + url) so we can point at
# Simple Icons' CDN, which returns each brand's official SVG. Appending a hex
# after the slug colors the SVG in the brand colour:
#   https://cdn.simpleicons.org/<brand>/<hex>
# Edit a hex (or remove it for monochrome) to taste.

linkedin:
  # Simple Icons dropped LinkedIn (trademark dispute, 2024) — using Iconify's
  # `logos` set instead, which serves the official brand mark pre-coloured.
  logo: https://api.iconify.design/logos:linkedin-icon.svg
  title: LinkedIn
  url: https://www.linkedin.com/in/amrita-singh-5546568b/

instagram:
  logo: https://cdn.simpleicons.org/instagram/E4405F
  title: Instagram
  url: https://instagram.com/amrita_112

x:
  logo: https://cdn.simpleicons.org/x/000000
  title: X
  url: https://x.com/amus_bouche

substack:
  logo: https://cdn.simpleicons.org/substack/FF6719
  title: Substack — Learning To Be Happy
  url: https://learningtobehappy.substack.com/

googlescholar:
  logo: https://cdn.simpleicons.org/googlescholar/4285F4
  title: Google Scholar
  url: https://scholar.google.com/citations?user=h98eTlQAAAAJ&hl=en
